<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0072CE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Assessments">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Field Assessments</title>
<style>
:root {
  --bg:#f3f6fa; --card:#ffffff; --ink:#18212d; --muted:#586577; --line:#d8e0ea;
  --accent:#0072CE; --accent-ink:#ffffff; --accent-soft:#e0eefa;
  --warn:#9a5a12; --warn-soft:#fdeed9; --bad:#b3261e; --bad-soft:#fbe3e0;
  --radius:12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#10151c; --card:#19212b; --ink:#e5ebf3; --muted:#98a5b6; --line:#2e3846;
    --accent:#4da3ea; --accent-ink:#06121f; --accent-soft:#132c45;
    --warn:#e8a95f; --warn-soft:#3a2a15; --bad:#f28b81; --bad-soft:#3d1d1a;
  }
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
a { color:var(--accent); }
h1,h2,h3 { line-height:1.2; margin:0 0 .5rem; }
h1 { font-size:1.35rem; } h2 { font-size:1.15rem; } h3 { font-size:1rem; }
p { margin:.25rem 0 .75rem; }
.top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:.75rem; padding:.7rem 16px; background:var(--card); border-bottom:1px solid var(--line); }
.top h1 { margin:0; flex:1; font-size:1.15rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top .back { text-decoration:none; font-weight:600; white-space:nowrap; }
.top .spacer { flex:1; }
.top .back { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.top > span.small { white-space:nowrap; }
main { max-width:920px; margin:0 auto; padding:16px; padding-bottom:48px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px; }
.card.subtle { background:transparent; }
.muted { color:var(--muted); } .small { font-size:.875rem; }
.btn, button { display:inline-flex; align-items:center; justify-content:center; gap:.35rem; min-height:44px; padding:.5rem 1rem; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; font-weight:600; text-decoration:none; cursor:pointer; }
.btn:hover, button:hover { border-color:var(--accent); }
.btn.primary, button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.danger, button.danger { color:var(--bad); }
.btn.small, button.small { min-height:36px; padding:.3rem .7rem; font-size:.875rem; }
button:disabled { opacity:.4; cursor:default; }
.actions { display:flex; flex-wrap:wrap; gap:.5rem; margin:.5rem 0 1rem; }
label.field { display:block; margin-bottom:.9rem; }
label.field > span { display:block; font-weight:600; margin-bottom:.3rem; }
input[type=text], input[type=number], input[type=date], input:not([type]), select, textarea {
  width:100%; min-height:44px; padding:.5rem .7rem; border:1px solid var(--line); border-radius:10px;
  background:var(--bg); color:var(--ink); font:inherit; font-size:16px;
}
input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
textarea { min-height:90px; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:0 12px; }
.chk { display:flex; align-items:center; gap:.5rem; font-weight:600; cursor:pointer; }
.chk input { width:20px; height:20px; }
.list { display:grid; gap:12px; }
.trial-card { display:block; text-decoration:none; color:inherit; }
.trial-card:hover { border-color:var(--accent); }
.trial-card h2 { margin-bottom:.2rem; }
.pill { display:inline-block; padding:.1rem .55rem; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:.8rem; font-weight:600; }
.empty { text-align:center; padding:2.5rem 1rem; color:var(--muted); }
.scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:10px; }
table { border-collapse:collapse; width:100%; font-size:.9rem; }
th, td { padding:.4rem .5rem; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap; }
th { background:var(--bg); font-weight:600; position:sticky; top:0; }
td.l, th.l { text-align:left; }
tr:last-child td { border-bottom:0; }
/* randomization grid */
.rand td { padding:.3rem; }
.rand .cell { display:flex; flex-direction:column; align-items:center; gap:2px; }
.rand .cell small { color:var(--muted); font-size:.72rem; }
.rand input { width:56px; min-height:40px; text-align:center; padding:.3rem; }
.rand input.err { border-color:var(--bad); background:var(--bad-soft); }
.rep-ok { color:var(--accent); font-weight:600; }
.rep-bad { color:var(--bad); font-weight:600; }
/* layout map */
.map td { padding:.35rem; }
.map .pc { display:block; min-width:52px; padding:.3rem; border-radius:8px; background:var(--bg); }
.map .pc b { display:block; }
.map .pc span { font-size:.75rem; color:var(--muted); }
.map .pc.done { background:var(--accent-soft); }
.map .pc.utc { background:var(--warn-soft); outline:2px solid var(--warn); }
.map .pc.utc b { color:var(--warn); }
.rand input.utc { background:var(--warn-soft); border-color:var(--warn); }
.map .pc.part { background:var(--warn-soft); }
/* assessment rows */
.arow { display:flex; flex-wrap:wrap; align-items:center; gap:.75rem; justify-content:space-between; }
.bar { height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin:.4rem 0; }
.bar > div { height:100%; background:var(--accent); }
/* type editor */
.type-row { display:grid; grid-template-columns:2fr 1fr .8fr .8fr auto; gap:8px; align-items:end; margin-bottom:10px; }
.type-row label > span { font-size:.8rem; font-weight:600; color:var(--muted); display:block; margin-bottom:2px; }
@media (max-width:560px) { .type-row { grid-template-columns:1fr 1fr; } .type-row .tname { grid-column:1 / -1; } }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { min-height:34px; padding:.2rem .7rem; border-radius:999px; font-weight:500; font-size:.875rem; }
/* entry */
.plot-card { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:center; gap:2px 14px; text-align:center; padding:8px 14px; margin-bottom:10px; }
.plot-no { font-size:1.5rem; font-weight:800; letter-spacing:-.01em; line-height:1.2; }
.plot-meta { font-size:1rem; color:var(--muted); }
.plot-meta b { color:var(--ink); }
.done-badge { display:inline-block; }
.plot-card .pill { font-size:.75rem; }
.entry-field input { font-size:1.4rem; min-height:56px; text-align:center; font-weight:600; }
.entry-field input.bad { border-color:var(--bad); background:var(--bad-soft); }
.entry-field input.warn { border-color:var(--warn); background:var(--warn-soft); }
.entry-field .hint { font-weight:400; color:var(--muted); font-size:.85rem; }
.shell { position:fixed; left:0; right:0; top:0; height:100dvh; z-index:10; display:flex; flex-direction:column; background:var(--bg); overflow:hidden; }
.shell > .top { flex:none; position:static; }
.shell > main.entry { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; width:100%; max-width:920px; margin:0 auto; padding:10px 16px 16px; }
body.kb-on .shell > main.entry { padding-bottom:16px; }
body.locked { overflow:hidden; }
.navbtns { flex:none; display:grid; grid-template-columns:1fr 1.6fr; gap:10px; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); }
.navbtns button { min-height:50px; font-size:1.05rem; }
main.entry .entry-field { margin-bottom:.6rem; }
main.entry .entry-field input { min-height:50px; }
/* review */
.review td.v { padding:.25rem; }
.review td.v input { width:70px; min-height:36px; padding:.2rem; text-align:center; font-size:.95rem; }
.review td.v a { display:block; font-size:.72rem; color:var(--muted); text-decoration:none; }
.review td.v a:hover { text-decoration:underline; }
.review td.miss input { background:var(--warn-soft); border-color:var(--warn); }
.review td.out input { background:var(--bad-soft); border-color:var(--bad); }
.review td.stat { font-variant-numeric:tabular-nums; }
.legend { display:flex; flex-wrap:wrap; gap:12px; font-size:.85rem; color:var(--muted); }
.sw { display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:4px; border:1px solid; }
.sw.miss { background:var(--warn-soft); border-color:var(--warn); }
.sw.out { background:var(--bad-soft); border-color:var(--bad); }
.issues li { margin-bottom:.2rem; }
#toast { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:.6rem 1rem; border-radius:10px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; max-width:calc(100% - 32px); }
#toast.show { opacity:1; }
.steps { display:flex; gap:8px; margin-bottom:14px; }
.step { flex:1; justify-content:flex-start; gap:.5rem; padding:.4rem .6rem; font-size:.9rem; }
.step b { display:inline-flex; width:24px; height:24px; border-radius:50%; align-items:center; justify-content:center; background:var(--line); color:var(--ink); font-size:.85rem; flex:none; }
.step.on { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
.step.on b { background:var(--accent); color:var(--accent-ink); }
.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:0 10px; }
.stagebox { background:var(--bg); border-radius:10px; padding:10px 12px 2px; margin-bottom:.9rem; }
.stagebox label.field > span { font-weight:500; font-size:.8rem; color:var(--muted); }
.stagebox label.field { margin-bottom:.6rem; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
.sheet { background:var(--card); width:100%; max-width:520px; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet button { width:100%; margin-bottom:8px; }
.review td.v .sb { width:48px; min-height:34px; margin:1px; }
.review td.v .mv { font-variant-numeric:tabular-nums; }
.visit { border-left:6px solid var(--line); }
.visit.new { border-left-color:var(--warn); }
.visit.part { border-left-color:var(--warn); }
.visit.complete { border-left-color:var(--accent); }
.vhead { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
.vdate { font-size:1.3rem; font-weight:800; line-height:1.2; }
.vlist { margin-top:8px; } .vlist ol { margin:.4rem 0 0; padding-left:1.4rem; } .vlist li { margin-bottom:.15rem; font-size:.9rem; }
.chip.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
#kbbar { position:fixed; left:0; right:0; bottom:0; z-index:30; display:none; gap:8px; padding:8px 10px; background:var(--card); border-top:1px solid var(--line); box-shadow:0 -2px 8px rgba(0,0,0,.15); }
#kbbar.show { display:flex; }
#kbbar button { flex:1; min-height:46px; padding:.2rem; font-size:1.3rem; }
#kbbar button.done { flex:1.4; font-size:1rem; }
#kbbar button[hidden] { display:none; }
body.kb-on main { padding-bottom:200px; }
.acard { border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px; background:var(--card); }
.ahead { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.anum { flex:none; width:28px; height:28px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-weight:700; display:flex; align-items:center; justify-content:center; font-size:.9rem; }
.atitle { flex:1; display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
.pill.warn { background:var(--warn-soft); color:var(--warn); }
.sumline { font-weight:600; margin:.2rem 0 .8rem; }
.subgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(70px,1fr)); gap:8px; }
.entry-field .subgrid input { font-size:1.2rem; min-height:50px; }
.nophyto { text-align:center; padding:.5rem; border-radius:10px; background:var(--accent-soft); color:var(--accent); font-weight:600; margin:0 0 .9rem; }
.trt-row { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:end; margin-bottom:.6rem; }
.trt-row .chk { min-height:44px; padding-bottom:.9rem; font-size:.9rem; white-space:nowrap; }
.sentinel { position:fixed; top:0; left:0; width:1px; height:1px; opacity:0; border:0; padding:0; min-height:0 !important; pointer-events:none; }
.bp svg { width:100%; height:auto; display:block; }
.bp text { fill:var(--muted); font-size:11px; font-family:inherit; }
.pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:.4rem; }
details summary { cursor:pointer; font-weight:600; min-height:32px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="kbbar" aria-label="Move between boxes">
  <button type="button" data-d="left" tabindex="-1" aria-label="Previous">◀</button>
  <button type="button" data-d="up" tabindex="-1" aria-label="Up">▲</button>
  <button type="button" data-d="down" tabindex="-1" aria-label="Down">▼</button>
  <button type="button" data-d="right" tabindex="-1" aria-label="Next">▶</button>
  <button type="button" data-d="done" class="done" tabindex="-1">Done</button>
</div>
<script>
'use strict';
/* ---------- storage ---------- */
const KEY = 'fieldAssessments.v1';
const app = document.getElementById('app');
let db = loadDB();

function loadDB() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) { const d = JSON.parse(s); d.trials = d.trials || []; d.settings = d.settings || {}; return d; }
  } catch (e) {}
  return { trials: [], settings: { showTrt: false } };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch (e) { toast('Could not save on this device. Export a backup now.'); return false; }
}

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
function num(s) {
  s = String(s ?? '').trim().replace(',', '.');
  if (s === '') return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}
const round = (n, d = 2) => n == null ? null : Math.round(n * 10 ** d) / 10 ** d;
const fmt = (n, d = 2) => n == null ? '–' : String(round(n, d));
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
function sd(a) { if (a.length < 2) return null; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); }
const dmy = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso || ''); };
function parseDmy(str) { // DD/MM/YYYY (also accepts - . and 2-digit years) -> YYYY-MM-DD, or '' if not a real date
  const m = /^\s*(\d{1,2})[\/.\-\s](\d{1,2})[\/.\-\s](\d{2}|\d{4})\s*$/.exec(str || ''); if (!m) return '';
  const y = m[3].length === 2 ? 2000 + +m[3] : +m[3], mo = +m[2], da = +m[1], dt = new Date(y, mo - 1, da);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== da) return '';
  return `${y}-${String(mo).padStart(2, '0')}-${String(da).padStart(2, '0')}`;
}
const range = n => Array.from({ length: n }, (_, i) => i + 1);
let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400); }
const go = h => { location.hash = h; };
const goReplace = h => { location.replace(h); };

/* ---------- lists: trial types, assessment menus, crops, weeds ---------- */
const TRIAL_TYPES = ['Fungicide', 'Herbicide', 'Biostimulant', 'SAT (Seed Applied Treatment)', 'BioFungicide', 'Insecticide', 'Growth Regulator (PGR)'];
const FUNG_PESTS = [
  ['Wheat', [['SEPTTR', 'Septoria'], ['PUCCST', 'Yellow Rust'], ['PUCCRT', 'Brown Rust'], ['ERYSGR', 'Powdery Mildew'], ['FUSASP', 'Fusarium']]],
  ['Barley', [['RHYNSE', 'Rhynchosporium'], ['PYRNTE', 'Net Blotch'], ['RAMUCC', 'Ramularia'], ['PUCCHD', 'Brown Rust'], ['ERYSGH', 'Powdery Mildew']]],
  ['OSR', [['LEPTMA', 'Phoma'], ['PYRNLI', 'Light Leaf Spot'], ['SCLESC', 'Sclerotinia']]],
];
const SAT_PESTS = [['SAT pests', [['USTINH', 'Loose Smut'], ['FUSASP', 'Fusarium spp.'], ['MONGNI', 'Microdochium Seedling Blight'], ['BYDV00', 'BYDV'], ['SEPTTR', 'Septoria'], ['ERYSGR', 'Powdery Mildew'], ['PUCCST', 'Yellow Rust'], ['RHYNSE', 'Rhynchosporium'], ['PYRNTE', 'Net Blotch'], ['RAMUCC', 'Ramularia']]]];
const LEAVES = ['Leaf 1', 'Leaf 2', 'Leaf 3', 'Leaf 4', 'Leaf 5', 'Leaf 6'];
// n=name u=unit min/max  tg=needs a weed/pest  leaf=needs leaf level  untr=untreated plots only
const PH = { u: '%', min: 0, max: 100, phyto: 1 };
const MENUS = [
  { key: 'common', label: 'Common assessments', items: [{ n: 'Samples' }, { n: 'General Phyto', ...PH }, { n: 'Chlorosis on Plants', ...PH }, { n: 'Deformation on Plants', ...PH }, { n: 'Stunting of Plants', ...PH }] },
  { key: 'fungicide', label: 'Fungicide specific', target: 'pest', noStage: true, groups: FUNG_PESTS, items: [{ n: 'Disease', u: '%', min: 0, max: 100, tg: 1, leaf: 1 }, { n: 'Green leaf area', u: '%', min: 0, max: 100, leaf: 1 }] },
  { key: 'herbicide', label: 'Herbicide specific', target: 'weed', groups: null, items: [{ n: 'Weed counts', u: 'plants/m²', min: 0, tg: 1 }, { n: 'Weed control', u: '%', min: 0, max: 100, tg: 1 }, { n: 'Weed counts', label: 'Untreated weed counts', u: 'plants/m²', min: 0, tg: 1, untr: 1 }, { n: 'Crop count', u: 'plants/m²', min: 0, untr: 1 }] },
  { key: 'sat', label: 'SAT specific', target: 'pest', noStage: true, groups: SAT_PESTS, items: [{ n: 'Emergence', u: '%', min: 0, max: 100 }, { n: 'Stand counts', u: 'plants/m²', min: 0 }, { n: 'Vigour', u: '0–9', min: 0, max: 9 }, { n: 'Seedling disease', u: '%', min: 0, max: 100, tg: 1 }, { n: 'Aphids/BYDV', min: 0, tg: 1 }] },
  { key: 'insecticide', label: 'Insecticide specific', target: 'pest', groups: [], items: [{ n: 'Pest counts', min: 0, tg: 1 }, { n: 'Pest efficacy', u: '%', min: 0, max: 100, tg: 1 }, { n: 'Damage scoring', u: '%', min: 0, max: 100 }] },
  { key: 'custom', label: 'Custom assessment', custom: true, items: [] },
  { key: 'pgr', label: 'Growth regulator (PGR) specific', items: [{ n: 'Plant height', u: 'cm', min: 0 }, { n: 'Lodging %', u: '%', min: 0, max: 100 }, { n: 'Stem strength' }, { n: 'Tiller counts', u: 'no./m²', min: 0 }] },
  { key: 'biostimulant', label: 'Biostimulant specific', items: [{ n: 'Vigour', u: '0–9', min: 0, max: 9 }, { n: 'Biomass' }, { n: 'Canopy', u: '%', min: 0, max: 100 }, { n: 'Stress recovery' }] },
];
const MENU_FOR = { 'Fungicide': ['fungicide'], 'BioFungicide': ['fungicide'], 'Herbicide': ['herbicide'], 'SAT (Seed Applied Treatment)': ['sat'], 'Insecticide': ['insecticide'], 'Growth Regulator (PGR)': ['pgr'], 'Biostimulant': ['biostimulant'] };
const CROPS = [
  ['Cereals', [['Winter Wheat', 'TRZAW'], ['Spring Wheat', 'TRZAS'], ['Winter Barley', 'HORVW'], ['Spring Barley', 'HORVS'], ['Winter Oats', 'AVESW'], ['Spring Oats', 'AVESA'], ['Winter Rye', 'SECCW'], ['Winter Triticale', 'TTLWI']]],
  ['Broadacre', [['Oilseed Rape', 'BRSNN'], ['Sugar Beet', 'BEAVA'], ['Maize', 'ZEAMX'], ['Potato', 'SOLTU']]],
  ['Pulses', [['Peas', 'PIBSX'], ['Field Beans', 'VICFX']]],
];
const WEEDS = [
  ['Grass weeds', [['ALOMY', 'Black-grass'], ['LOLMU', 'Italian Ryegrass'], ['AVEFA', 'Wild Oat'], ['BROSS', 'Brome spp.'], ['POAAN', 'Annual Meadow-grass'], ['AGRRE', 'Couch Grass']]],
  ['Broadleaf weeds', [['GALAP', 'Cleavers'], ['CHEAL', 'Fat Hen'], ['PAPRH', 'Poppy'], ['SINAR', 'Charlock'], ['STEME', 'Chickweed'], ['MATIN', 'Scentless Mayweed'], ['POLPE', 'Redshank'], ['CAPBP', "Shepherd's Purse"]]],
];
MENUS.find(m => m.key === 'herbicide').groups = WEEDS;
const cropLabel = c => `${c[0]} (${c[1]})`;
const isKnownCrop = s => CROPS.some(g => g[1].some(c => cropLabel(c) === s));

/* ---------- arrow bar above the keyboard (keeps the keyboard open while moving between boxes) ---------- */
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const kb = (() => {
  const bar = document.getElementById('kbbar');
  const coarse = matchMedia('(pointer:coarse)');
  let handler = null;
  const pinned = new Set();
  let shellEl = null;
  // keeps the bar (and any pinned buttons, e.g. Next) just above the on-screen keyboard
  const place = () => {
    const v = window.visualViewport, off = v ? Math.max(0, innerHeight - v.height - v.offsetTop) : 0;
    bar.style.bottom = off + 'px';
    const extra = bar.classList.contains('show') ? bar.offsetHeight : 0;
    pinned.forEach(el => { if (!el.isConnected) pinned.delete(el); else el.style.bottom = (off + extra) + 'px'; });
    if (shellEl) { // the whole entry screen is sized to the part of the screen that is visible, so Next can't hide behind the keyboard
      if (!shellEl.isConnected) shellEl = null;
      else { shellEl.style.top = (v ? v.offsetTop : 0) + 'px'; shellEl.style.height = (v ? v.height : innerHeight) + 'px'; shellEl.style.paddingBottom = extra + 'px'; }
    }
  };
  if (window.visualViewport) { visualViewport.addEventListener('resize', place); visualViewport.addEventListener('scroll', place); }
  const tagged = el => el && el.hasAttribute && el.hasAttribute('data-kb');
  function hide() { bar.classList.remove('show'); document.body.classList.remove('kb-on'); place(); }
  bar.querySelectorAll('button').forEach(b => {
    b.addEventListener('mousedown', e => e.preventDefault()); // don't steal focus from the box, so the keyboard stays up
    b.addEventListener('click', () => { if (b.dataset.d === 'done') { if (document.activeElement) document.activeElement.blur(); hide(); } else if (handler) handler.go(b.dataset.d); });
  });
  document.addEventListener('focusin', e => {
    if (!tagged(e.target) || !handler || !coarse.matches || (isIOS && !db.settings.arrowBar)) return;
    bar.querySelectorAll('button[data-d]').forEach(b => { if (b.dataset.d !== 'done') b.hidden = !handler.dirs.includes(b.dataset.d); });
    bar.classList.add('show'); document.body.classList.add('kb-on'); place();
    const el = e.target; setTimeout(() => { if (document.activeElement === el) el.scrollIntoView({ block: 'center' }); }, 300);
  });
  document.addEventListener('focusout', () => setTimeout(() => { if (!tagged(document.activeElement)) hide(); }, 80));
  const sentinel = (which, tab) => `<input class="sentinel" data-sent="${which}" ${tab ? `tabindex="${tab}"` : ''} inputmode="decimal" autocomplete="off" aria-hidden="true">`;
  return {
    sentinel,
    pin(el) { pinned.add(el); place(); },
    shell(el) { shellEl = el; document.body.classList.add('locked'); place(); },
    leave() { shellEl = null; document.body.classList.remove('locked'); },
    // h = { dirs: ['left','right','up','down'], go(dir) }; els = the boxes the bar should work for
    use(h, els) { handler = h; els.forEach(el => el.setAttribute('data-kb', '')); },
    hide,
    // desktop: ▲/▼ keys do the same as the bar
    key(e) { const d = { ArrowUp: 'up', ArrowDown: 'down' }[e.key]; if (d && handler && handler.dirs.includes(d)) { e.preventDefault(); handler.go(d); return true; } return false; },
  };
})();

/* ---------- trial model ---------- */
const getTrial = id => db.trials.find(t => t.id === id);
function plotNo(t, r, i) { // r, i are 0-based
  if (t.numbering === 'seq') return r * t.trts + i + 1;
  const base = t.trts > 99 ? 1000 : 100;
  return (r + 1) * base + i + 1;
}
function plots(t) {
  const out = [];
  t.layout.forEach((row, r) => row.forEach((trt, i) => out.push({ plot: plotNo(t, r, i), rep: r + 1, pos: i + 1, trt: Number(trt) })));
  return out;
}
function walkOrder(t) {
  const all = plots(t);
  if (!t.serpentine) return all;
  const out = [];
  for (let r = 1; r <= t.reps; r++) { const row = all.filter(p => p.rep === r); if (r % 2 === 0) row.reverse(); out.push(...row); }
  return out;
}
const trtName = (t, k) => (t.trtNames && t.trtNames[k - 1]) || '';
const trtLabel = (t, k) => trtName(t, k) ? `${k} – ${trtName(t, k)}` : `Trt ${k}`;
const blankLayout = (reps, trts) => range(reps).map(() => range(trts).map(() => ''));
function repStatus(row, trts) {
  const counts = {}; let blanks = 0, bad = 0;
  row.forEach(v => { const n = Number(v); if (v === '' || v == null) blanks++; else if (!Number.isInteger(n) || n < 1 || n > trts) bad++; else counts[n] = (counts[n] || 0) + 1; });
  const missing = range(trts).filter(k => !counts[k]);
  const dup = Object.keys(counts).filter(k => counts[k] > 1);
  return { ok: !blanks && !bad && !missing.length && !dup.length, blanks, bad, missing, dup };
}

/* ---------- assessment model ---------- */
const rawVal = (a, plot, typeId) => (a.data[plot] && a.data[plot][typeId]) ?? '';
// "No phyto" assessments count as 0 on every plot unless a value was typed in
const val = (a, plot, typeId) => {
  const v = rawVal(a, plot, typeId); if (v !== '') return v;
  const ty = a.types.find(x => x.id === typeId); return ty && ty.noPhyto ? '0' : '';
};
const plotTrtCache = new WeakMap();
function trtOfPlot(t, plot) {
  let m = plotTrtCache.get(t.layout);
  if (!m) { m = new Map(plots(t).map(p => [p.plot, p.trt])); plotTrtCache.set(t.layout, m); }
  return m.get(plot);
}
const applies = (t, ty, trt) => !ty.untreatedOnly || (!!t.untreated && trt === t.untreated);
// growth stage (+ size for weeds) is asked for weeds and insect pests, not for diseases
const isPhyto = ty => !!ty.phyto || /phyto/i.test(ty.name);
const needsStage = ty => !!ty.target && (ty.needStage !== undefined ? ty.needStage : ty.kind === 'weed');
const subsOf = ty => Math.max(1, Math.min(50, parseInt(ty.subs, 10) || 1));
const subMean = arr => { const ns = arr.map(num).filter(n => n != null); return ns.length ? String(round(mean(ns), 4)) : null; };
const plotComplete = (t, a, plot) => a.types.length > 0 && a.types.filter(ty => !ty.untreatedOnly).every(ty => val(a, plot, ty.id) !== ''); // untreated-only items are entered at the end, in Review
function setSubValue(a, plot, ty, k, v) { // keeps the subsamples and stores their mean as the plot value
  const r = a.data[plot] || (a.data[plot] = {}), key = '_s_' + ty.id;
  const arr = (r[key] || []).slice(); while (arr.length <= k) arr.push('');
  arr[k] = String(v).trim();
  const any = arr.some(x => x !== '');
  if (any) r[key] = arr; else delete r[key];
  const m = any ? subMean(arr) : null;
  if (m === null) delete r[ty.id]; else r[ty.id] = m;
  if (!Object.keys(r).length) delete a.data[plot];
  return m;
}
const plotStarted = (a, plot) => a.types.some(ty => rawVal(a, plot, ty.id) !== '');
const countDone = (t, a) => plots(t).filter(p => plotComplete(t, a, p.plot)).length;
function firstIncomplete(t, a) { const w = walkOrder(t); const i = w.findIndex(p => !plotComplete(t, a, p.plot)); return i < 0 ? 0 : i; }
function outOfRange(ty, raw) {
  if (raw === '') return '';
  const n = num(raw);
  if (n == null) return 'warn';
  if ((ty.min !== '' && ty.min != null && n < Number(ty.min)) || (ty.max !== '' && ty.max != null && n > Number(ty.max))) return 'bad';
  return '';
}
const typeTitle = ty => [ty.name, ty.target, ty.leaf, ty.untreatedOnly ? 'Untreated' : ''].filter(Boolean).join(' – ');
const typeLabel = ty => typeTitle(ty) + (ty.unit ? ` (${ty.unit})` : '');
function typeStats(t, a, ty) {
  const groups = {};
  range(t.trts).forEach(k => groups[k] = { vals: [], nums: [] });
  plots(t).forEach(p => {
    const g = groups[p.trt]; if (!g) return;
    const raw = val(a, p.plot, ty.id); const n = num(raw);
    g.vals.push({ ...p, raw, n }); if (n != null) g.nums.push(n);
  });
  let ss = 0, df = 0;
  Object.values(groups).forEach(g => {
    g.mean = mean(g.nums); g.sd = sd(g.nums); g.n = g.nums.length;
    g.cv = (g.sd != null && g.mean) ? g.sd / Math.abs(g.mean) * 100 : null;
    if (g.n > 1) { g.nums.forEach(x => ss += (x - g.mean) ** 2); df += g.n - 1; }
  });
  const pooled = df > 0 ? Math.sqrt(ss / df) : null;
  // Leave-one-out check: compare each value with the other reps of its treatment,
  // using the within-treatment spread measured without that value.
  Object.values(groups).forEach(g => {
    const gss = g.n > 1 ? g.nums.reduce((s, x) => s + (x - g.mean) ** 2, 0) : 0;
    const gdf = Math.max(g.n - 1, 0);
    g.vals.forEach(v => {
      v.outlier = false;
      if (v.n == null || g.n < 2) return;
      const others = g.nums.slice(); others.splice(others.indexOf(v.n), 1);
      const m = others.length, om = mean(others);
      const oss = m > 1 ? others.reduce((s, x) => s + (x - om) ** 2, 0) : 0;
      const ldf = df - gdf + Math.max(m - 1, 0), lss = ss - gss + oss;
      if (ldf < 1) return;
      const s = Math.sqrt(lss / ldf);
      v.outlier = s > 0 ? Math.abs(v.n - om) > 3 * s * Math.sqrt(1 + 1 / m) : v.n !== om;
    });
  });
  return { groups, pooled };
}

/* ---------- router ---------- */
window.addEventListener('hashchange', render);
function render() {
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  window.scrollTo(0, 0); kb.hide(); kb.leave();
  if (p[0] === 'trial') {
    if (p[1] === 'new') return viewTrialForm(null);
    const t = getTrial(p[1]);
    if (!t) return viewHome();
    if (!p[2]) return viewTrial(t);
    if (p[2] === 'edit') return viewTrialForm(t);
    if (p[2] === 'a') {
      if (p[3] === 'new') return viewAssessForm(t, null, 1);
      const a = t.assessments.find(x => x.id === p[3]);
      if (!a) return viewTrial(t);
      if (p[4] === 'edit') return viewAssessForm(t, a, p[5] === '2' ? 2 : 1);
      if (p[4] === 'review') return viewReview(t, a);
      if (p[4] === 'plot') return viewEntry(t, a, parseInt(p[5], 10) || 0);
      if (!a.types.length) return goReplace(`#/trial/${t.id}/a/${a.id}/edit/2`);
      return goReplace(`#/trial/${t.id}/a/${a.id}/plot/${firstIncomplete(t, a)}`);
    }
  }
  viewHome();
}

/* ---------- HOME ---------- */
function viewHome() {
  const trials = [...db.trials].sort((a, b) => (b.updated || 0) - (a.updated || 0));
  app.innerHTML = `
  <header class="top"><h1>Field Assessments</h1><a class="btn primary small" href="#/trial/new">+ Add trial</a></header>
  <main>
    ${trials.length ? `<div class="list">${trials.map(t => `
      <a class="card trial-card" href="#/trial/${t.id}">
        <h2>${esc(t.trialId)}</h2>
        ${t.desc ? `<p class="muted">${esc(t.desc)}</p>` : ''}
        ${(t.type || t.crop) ? `<div class="pills">${t.type ? `<span class="pill">${esc(t.type)}</span>` : ''}${t.crop ? `<span class="pill">${esc(t.crop)}</span>` : ''}</div>` : ''}
        <div class="small muted" style="margin-top:.4rem">${t.reps} reps × ${t.trts} treatments · ${t.reps * t.trts} plots ·
          <span class="pill">${t.assessments.length} assessment${t.assessments.length === 1 ? '' : 's'}</span></div>
      </a>`).join('')}</div>`
    : `<div class="card empty"><h2>No trials yet</h2><p>Add a trial to set up reps, treatments and your randomization.</p>
        <a class="btn primary" href="#/trial/new">+ Add trial</a></div>`}
    <section class="card subtle" style="margin-top:24px">
      <p id="offline-status" class="small"></p>
      <h3>Backup &amp; move between devices</h3>
      <p class="small muted">All data is saved in this browser on this device. Export a backup regularly, and use Restore to load it on another device.</p>
      <label class="chk small" style="margin-bottom:12px"><input type="checkbox" id="arrowbar" ${db.settings.arrowBar ? 'checked' : ''}> Show my own ◀ ▲ ▼ ▶ bar above the keyboard <span class="muted" style="font-weight:400">(iPhone/iPad already have their own arrows above the keyboard; Android always shows mine)</span></label>
      <div class="actions">
        <button id="backup">Export backup (.json)</button>
        <label class="btn">Restore backup<input type="file" id="restore" accept=".json,application/json" hidden></label>
      </div>
    </section>
  </main>`;
  updateOfflineStatus();
  document.getElementById('arrowbar').onchange = e => { db.settings.arrowBar = e.target.checked; save(); };
  document.getElementById('backup').onclick = () => {
    download(new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' }), `field-assessments-backup_${dmy(today()).replace(/\//g, '-')}.json`);
  };
  document.getElementById('restore').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!Array.isArray(d.trials)) throw new Error();
      if (!confirm(`Restore ${d.trials.length} trial(s) from backup? Trials already on this device with the same identity will be replaced; others are kept.`)) return;
      d.trials.forEach(nt => { const i = db.trials.findIndex(t => t.id === nt.id); if (i >= 0) db.trials[i] = nt; else db.trials.push(nt); });
      save(); toast('Backup restored'); viewHome();
    } catch (err) { alert('That file is not a valid backup.'); }
  };
}

        <label class="field"><span>Number of reps *</span><input id="f-reps" type="number" inputmode="numeric" min="1" max="50" value="${d.reps}" ${locked ? 'disabled' : ''}></label>
        <label class="field"><span>Number of treatments *</span><input id="f-trts" type="number" inputmode="numeric" min="1" max="200" value="${d.trts}" ${locked ? 'disabled' : ''}></label>

          </select></label>

      <div class="actions"><button id="r-clear" class="small">Clear all</button></div>

  let step = 1;

  const $ = id => document.getElementById(id);

    $('trt-names').querySelectorAll('input[data-u]').forEach(cb => cb.onchange = () => {
      d.untreated = cb.checked ? +cb.dataset.u : 0;
      $('trt-names').querySelectorAll('input[data-u]').forEach(o => { o.checked = +o.dataset.u === d.untreated; });
      d.layout.forEach((_, r) => updateRow(r));
    });
  }
  function drawRand() {
    const tmp = { ...d };
    $('rand').innerHTML = `${kb.sentinel('prev', 1)}<div class="scroll"><table class="rand"><tbody>
      ${range(d.reps).reverse().map(rn => {
        const r = rn - 1, row = d.layout[r];
        const st = repStatus(row, d.trts);
        return `<tr><th class="l">Rep ${rn}</th>
          ${row.map((v, i) => `<td><div class="cell"><small>${plotNo(tmp, r, i)}</small>
            <input data-r="${r}" data-i="${i}" tabindex="${2 + r * d.trts + i}" value="${esc(v)}" inputmode="numeric" enterkeyhint="next" autocomplete="off"></div></td>`).join('')}
          <td class="l" id="st-${r}">${statusHtml(st)}</td></tr>`;
      }).join('')}
    </tbody></table></div>${kb.sentinel('next', 2 + d.reps * d.trts)}`;
    const boxes = [...$('rand').querySelectorAll('input:not(.sentinel)')];
    function move(dir) { // rep 1 is the bottom row, so "up" is the next rep
      const cur = document.activeElement; if (!cur || cur.dataset.r === undefined) return;
      let r = +cur.dataset.r, i = +cur.dataset.i;
      if (dir === 'right') { i++; if (i >= d.trts) { i = 0; r++; } }
      else if (dir === 'left') { i--; if (i < 0) { i = d.trts - 1; r--; } }
      else if (dir === 'up') r++;
      else r--;
      const n = $('rand').querySelector(`input[data-r="${r}"][data-i="${i}"]`); if (n) n.focus();
    }
    boxes.forEach(inp => {
      inp.oninput = () => {
        const r = +inp.dataset.r; d.layout[r][+inp.dataset.i] = inp.value.trim() === '' ? '' : Number(inp.value.trim()) || inp.value.trim();
        updateRow(r);
        const n = Number(inp.value.trim()); // jump on once the number can't get any longer (e.g. 3 of 6 treatments, 12 of 12)
        if (Number.isInteger(n) && n >= 1 && n <= d.trts && n * 10 > d.trts) move('right');
      };
      inp.onfocus = () => setTimeout(() => inp.select(), 0);
      inp.onkeydown = e => { if (kb.key(e)) return; if (e.key === 'Enter') { e.preventDefault(); move('right'); } };
    });
    $('rand').querySelector('[data-sent="prev"]').onfocus = () => boxes.find(b => b.dataset.r === '0' && b.dataset.i === '0').focus();
    $('rand').querySelector('[data-sent="next"]').onfocus = () => boxes.find(b => +b.dataset.r === d.reps - 1 && +b.dataset.i === d.trts - 1).focus();
    kb.use({ dirs: ['left', 'right', 'up', 'down'], go: move }, boxes);
    d.layout.forEach((_, r) => updateRow(r));
  }
  function statusHtml(st) {
    if (st.ok) return `<span class="rep-ok">✓</span>`;
    const msg = [];
    if (st.blanks) msg.push(`${st.blanks} blank`);
    if (st.bad) msg.push(`${st.bad} invalid`);
    if (st.missing.length && !st.blanks) msg.push(`missing ${st.missing.join(', ')}`);
    if (st.dup.length) msg.push(`repeated ${st.dup.join(', ')}`);
    return `<span class="rep-bad small">${msg.join('; ')}</span>`;
  }
  function updateRow(r) {
    const st = repStatus(d.layout[r], d.trts);
    $('st-' + r).innerHTML = statusHtml(st);
    const counts = {}; d.layout[r].forEach(v => counts[v] = (counts[v] || 0) + 1);
    $('rand').querySelectorAll(`input[data-r="${r}"]`).forEach(inp => {
      const v = d.layout[r][+inp.dataset.i]; const n = Number(v);
      inp.classList.toggle('utc', !!d.untreated && n === d.untreated);
      inp.classList.toggle('err', v === '' || !Number.isInteger(n) || n < 1 || n > d.trts || counts[v] > 1);
    });
  }
  function resize() {
    const reps = clamp(parseInt($('f-reps').value, 10) || 1, 1, 50);
    const trts = clamp(parseInt($('f-trts').value, 10) || 1, 1, 200);
    if (reps === d.reps && trts === d.trts) return;
    d.reps = reps; d.trts = trts;
    d.layout = blankLayout(reps, trts);
    drawNames(); drawRand();
    toast('Layout cleared – fill in the randomization');
  }
  $('f-crop').onchange = () => { const o = $('f-crop').value === '__other'; $('crop-other-wrap').hidden = !o; if (o) $('f-crop-other').focus(); };
  $('f-reps').onchange = resize; $('f-trts').onchange = resize;
  $('f-num').onchange = () => { d.numbering = $('f-num').value; drawRand(); };
  $('f-serp').onchange = () => { d.serpentine = $('f-serp').checked; };
  $('r-clear').onclick = () => { if (!confirm('Clear every plot in the randomization?')) return; d.layout = blankLayout(d.reps, d.trts); drawRand(); $('rand').querySelector('input:not(.sentinel)').focus(); };
  $('paste-go').onclick = () => {
    const N = d.reps * d.trts;
    const lines = $('paste').value.split(/\r?\n/).map(l => l.trim()).filter(l => l && /\d/.test(l));
    const nums = $('paste').value.split(/[\s,;]+/).filter(Boolean).map(Number);
    // Two columns per line (plot number, treatment) — e.g. copied from a protocol table
    const pairs = lines.map(l => l.split(/[\s,;]+/).filter(Boolean).map(Number));
    if (pairs.length === N && pairs.every(p => p.length === 2 && p.every(Number.isInteger))) {
      const map = new Map(pairs.map(([pl, k]) => [pl, k]));
      const missing = [];
      const lay = range(d.reps).map((_, r) => range(d.trts).map((_, i) => {
        const pl = plotNo(d, r, i); if (!map.has(pl)) missing.push(pl); return map.get(pl) ?? '';
      }));
      if (missing.length) { alert(`These plot numbers weren't in the pasted list: ${missing.slice(0, 10).join(', ')}${missing.length > 10 ? '…' : ''}. Check the plot numbering setting above.`); return; }
      d.layout = lay; drawRand(); toast('Randomization applied'); return;
    }
    if (nums.length !== N || nums.some(n => !Number.isInteger(n))) {
      alert(`Expected ${N} treatment numbers (${d.reps} reps × ${d.trts} treatments), or ${N} lines of "plot  treatment", but found ${nums.length} numbers.`); return;
    }
    d.layout = range(d.reps).map((_, r) => nums.slice(r * d.trts, (r + 1) * d.trts));
    drawRand(); toast('Randomization applied');
  };
  $('save').onclick = () => {
    d.trialId = $('f-id').value.trim(); d.desc = $('f-desc').value.trim();
    d.type = $('f-type').value;
    d.crop = $('f-crop').value === '__other' ? $('f-crop-other').value.trim() : $('f-crop').value;
    if (!d.trialId) { alert('Please enter a Trial ID.'); $('f-id').focus(); return; }
    if (db.trials.some(t => t.id !== d.id && t.trialId.toLowerCase() === d.trialId.toLowerCase()) && !confirm(`A trial called "${d.trialId}" already exists. Save anyway?`)) return;
    const sts = d.layout.map(row => repStatus(row, d.trts));
    if (sts.some(s => s.blanks || s.bad)) { alert('Every plot needs a treatment number between 1 and ' + d.trts + '.'); return; }
    if (sts.some(s => !s.ok) && !confirm('Some reps do not contain each treatment exactly once. Save anyway?')) return;
    if (locked && JSON.stringify(trial.layout) !== JSON.stringify(d.layout) && !confirm('This trial has data. Changing the randomization will re-assign existing plot data to the new treatments. Continue?')) return;
    d.layout = d.layout.map(row => row.map(Number));
    d.untreated = Number(d.untreated) || 0;
    d.trtNames = range(d.trts).map(k => (d.trtNames[k - 1] || '').trim());
    d.updated = Date.now();
    const i = db.trials.findIndex(t => t.id === d.id);
    if (i >= 0) db.trials[i] = d; else db.trials.push(d);
    save(); toast(editing ? 'Trial saved' : 'Trial created');
    go('#/trial/' + d.id);
  };
  function goStep(n) {
    if (n > 1 && !$('f-id').value.trim()) { alert('Please enter a Trial ID first.'); showStep(1); $('f-id').focus(); return; }
    if (n > 1) resize();
    showStep(n);
    if (n === 3) { const e = [...$('rand').querySelectorAll('input:not(.sentinel)')].sort((x, y) => (+x.dataset.r - +y.dataset.r) || (+x.dataset.i - +y.dataset.i)).find(x => x.value === ''); if (e) e.focus(); }
  }
  app.querySelectorAll('.step').forEach(b => b.onclick = () => goStep(+b.dataset.st));
  $('w-next').onclick = () => goStep(step + 1);
  $('w-back').onclick = () => goStep(step - 1);
  drawNames(); drawRand(); showStep(1);
  if (!editing) $('f-id').focus();
}

          <span class="pill ${status[1]}">${status[0]}</span>

        ${a.types.length ? `<div class="bar"><div style="width:${done / n * 100}%"></div></div>
          <div class="small muted">${done} of ${n} plots complete</div>
          <details class="vlist"><summary>${a.types.length} assessment${a.types.length === 1 ? '' : 's'}</summary>
            <ol>${a.types.map(ty => `<li>${esc(typeLabel(ty))}</li>`).join('')}</ol></details>` : ''}
        <div class="actions" style="margin:12px 0 0">
          <a class="btn primary" href="#/trial/${t.id}/a/${a.id}">${!a.types.length ? 'Add assessments' : done ? (done === n ? 'Open' : 'Continue') : 'Start assessing'}</a>

          <button class="danger" data-del="${a.id}">Delete</button>
        </div>
      </section>`;
    }).join('') : `<div class="card empty"><p>No assessment dates yet.</p><a class="btn primary" href="#/trial/${t.id}/a/new">+ New assessment date</a></div>`}

    <section class="card">
      <h2>Field layout</h2>
      <p class="small muted">Plot number and treatment for each plot. Rep 1 is at the bottom.${t.untreated ? ' <span class="pill warn">Highlighted = untreated</span>' : ''}</p>
      <div class="scroll"><table class="map"><tbody>
        ${t.layout.map((row, r) => `<tr><th class="l">Rep ${r + 1}</th>${row.map((k, i) => `<td><span class="pc ${k === t.untreated ? 'utc' : ''}"><b>${plotNo(t, r, i)}</b><span>T${k}${k === t.untreated ? ' · UTC' : ''}</span></span></td>`).join('')}</tr>`).reverse().join('')}
      </tbody></table></div>
      ${t.trtNames.some(Boolean) ? `<p class="small" style="margin-top:12px">${range(t.trts).map(k => `<b>T${k}</b> ${esc(trtName(t, k) || '—')}${k === t.untreated ? ' (untreated)' : ''}`).join(' · ')}</p>` : ''}
    </section>
  </main>`;
  document.getElementById('xl').onclick = () => openExport(t, null);
  app.querySelectorAll('[data-xp]').forEach(b => b.onclick = () => openExport(t, t.assessments.find(x => x.id === b.dataset.xp)));

  });
}

  const addPick = v => { v = (v || '').trim(); if (v && !picked.includes(v)) { picked.push(v); drawPicked(); } };
  function drawBuilder() {

    $('bld').innerHTML = `<div class="stagebox" style="padding-bottom:10px">

        ${groups.map(([g, items]) => `<optgroup label="${g}">${items.map(([c, n]) => `<option value="${c}">${c} (${esc(n)})</option>`).join('')}</optgroup>`).join('')}</select></label>` : ''}
      <label class="field"><span>${groups.length ? 'Or type your own' : 'Type a ' + word}</span>
        <span style="display:flex;gap:8px"><input id="b-txt" placeholder="Code or name" autocomplete="off" autocapitalize="characters"><button id="b-add" class="small" type="button">Add</button></span></label>
      <div id="b-picked" class="chips" style="margin-bottom:12px"></div>
      ${hasLeaf ? `<b class="small">Leaf level(s)</b><div class="chips" id="b-leaves" style="margin:6px 0 4px">${LEAVES.map(l => `<button class="chip ${leaves.includes(l) ? 'on' : ''}" data-l="${l}" type="button">${l}</button>`).join('')}</div>` : ''}
    </div>`;
    drawPicked();
    if ($('b-sel')) $('b-sel').onchange = () => { addPick($('b-sel').value); $('b-sel').value = ''; };
    $('b-add').onclick = () => { addPick($('b-txt').value); $('b-txt').value = ''; };
    $('b-txt').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('b-add').click(); } };
    $('bld').querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
      const l = b.dataset.l; leaves = leaves.includes(l) ? leaves.filter(x => x !== l) : [...leaves, l].sort((x, y) => LEAVES.indexOf(x) - LEAVES.indexOf(y));
      b.classList.toggle('on', leaves.includes(l));
    });
  }
  $('add-custom').onclick = () => {
    const name = $('c-name').value.trim();
    if (!name) { toast('Give the custom assessment a name'); $('c-name').focus(); return; }
    const sb = Math.max(1, Math.min(50, parseInt($('c-subs').value, 10) || 1));
    const ok = addIfNew({ ...blankType(), name, unit: $('c-unit').value.trim(), min: $('c-min').value.trim(), max: $('c-max').value.trim(), subs: sb, untreatedOnly: $('c-untr').checked });
    if (!ok) { toast('Already added'); return; }
    ['c-name', 'c-unit', 'c-min', 'c-max'].forEach(id => { $(id).value = ''; }); $('c-untr').checked = false; $('c-subs').value = 1;
    drawTypes(); toast('Custom assessment added');
  };
  $('a-menu').onchange = () => { menuKey = $('a-menu').value; sel = new Set(); picked = []; leaves = []; drawMenu(); drawBuilder(); };
  $('b-subs').onchange = () => { $('b-subs').value = subsVal(); };

  $('add-assess').onclick = () => {
    const m = getMenu(), kind = m.target, word = kind === 'weed' ? 'weed' : 'pest';
    if ($('b-txt') && $('b-txt').value.trim()) { addPick($('b-txt').value); $('b-txt').value = ''; }
    const items = [...sel].sort((x, y) => x - y).map(i => m.items[i]);
    if (!items.length) { toast('Choose an assessment first'); return; }
    for (const it of items) {
      if (it.tg && !picked.length) { toast(`Choose a ${word} first`); return; }
      if (it.leaf && !leaves.length) { toast('Choose a leaf level first'); return; }
    }
    let n = 0;
    items.forEach(it => (it.tg ? picked : ['']).forEach(tg => (it.leaf ? leaves : ['']).forEach(l => { if (addIfNew(mkType(it, { target: tg, kind: tg ? kind : '', needStage: !!tg && !m.noStage, leaf: l }))) n++; })));
    sel = new Set(); $('b-untr').checked = false;
    drawMenu(); drawTypes();
    toast(n ? `Added ${n} assessment${n > 1 ? 's' : ''}` : 'Already added');
  };

  /* Added Assessments: one separate card each */
  function cardHtml(ty, i) {
    const weed = ty.kind === 'weed', word = weed ? 'Weed' : 'Pest';
    const inp = (f, label, ph) => `<label class="field"><span>${label}</span><input data-i="${i}" data-f="${f}" inputmode="decimal" value="${esc(ty[f] || '')}" placeholder="${ph || ''}" autocomplete="off"></label>`;
    return `<div class="acard">
      <div class="ahead"><span class="anum">${i + 1}</span>
        <div class="atitle"><b>${esc(ty.name || 'New assessment')}</b>${ty.target ? `<span class="pill">${esc(ty.target)}</span>` : ''}${ty.leaf ? `<span class="pill">${esc(ty.leaf)}</span>` : ''}${ty.untreatedOnly ? `<span class="pill warn">Untreated plots only</span>` : ''}${ty.noPhyto ? `<span class="pill">No phyto</span>` : ''}</div>
        <button class="small danger" data-rm="${i}" title="Remove" aria-label="Remove" type="button">✕</button></div>
      ${needsStage(ty) ? `<div class="stagebox"><b class="small">${word} growth stage</b>
        <div class="grid3" style="margin-top:6px">${inp('stage', 'Majority *')}${inp('stageMin', 'Minimum')}${inp('stageMax', 'Maximum')}</div>
        ${weed ? `<b class="small">Weed size</b><div class="grid2" style="margin-top:6px">${inp('sizeL', 'Length', 'cm')}${inp('sizeW', 'Width', 'cm')}</div>` : ''}</div>` : ''}
      <label class="chk" style="margin-bottom:.9rem"><input type="checkbox" data-i="${i}" data-c="untreatedOnly" ${ty.untreatedOnly ? 'checked' : ''}> Record on untreated plots only</label>
      ${isPhyto(ty) ? `<label class="chk" style="margin-bottom:.9rem"><input type="checkbox" data-i="${i}" data-c="noPhyto" ${ty.noPhyto ? 'checked' : ''}> No phyto (fills 0 on every plot)</label>` : ''}
      <details ${ty.name ? '' : 'open'}><summary>Name, unit, range, subsamples</summary>
        <div class="type-row" style="margin-top:8px">
          <label class="tname"><span>Name</span><input data-i="${i}" data-f="name" value="${esc(ty.name)}" placeholder="Type an assessment name"></label>
          <label><span>Unit</span><input data-i="${i}" data-f="unit" value="${esc(ty.unit)}" placeholder="%, cm, 0–9"></label>
          <label><span>Min</span><input data-i="${i}" data-f="min" value="${esc(ty.min)}" inputmode="decimal"></label>
          <label><span>Max</span><input data-i="${i}" data-f="max" value="${esc(ty.max)}" inputmode="decimal"></label>
          <label><span>Subsamples</span><input data-i="${i}" data-f="subs" value="${subsOf(ty)}" inputmode="numeric"></label>
        </div>
      </details>
    </div>`;
  }
  function drawTypes() {
    const n = d.types.length;
    const weeds = new Set(d.types.filter(x => x.kind === 'weed').map(x => x.target)).size, pests = new Set(d.types.filter(x => x.kind === 'pest').map(x => x.target)).size;
    $('sum').textContent = n ? `${n} assessment${n > 1 ? 's' : ''} added${weeds ? ` · ${weeds} weed${weeds > 1 ? 's' : ''}` : ''}${pests ? ` · ${pests} pest${pests > 1 ? 's' : ''}` : ''}` : '';
    $('types').innerHTML = d.types.map(cardHtml).join('') || `<p class="muted">Nothing added yet. Describe an assessment above and tap <b>+ Add assessment</b>.</p>`;
    $('types').querySelectorAll('input[data-f]').forEach(inp => inp.oninput = () => {
      const i = +inp.dataset.i, f = inp.dataset.f, ty = d.types[i]; ty[f] = inp.value;
      if (STAGE_FIELDS.includes(f) && needsStage(ty)) d.types.forEach((o, j) => { if (j !== i && o.target === ty.target && o.kind === ty.kind) { o[f] = inp.value; const el = $('types').querySelector(`input[data-i="${j}"][data-f="${f}"]`); if (el) el.value = inp.value; } });
    });
    $('types').querySelectorAll('input[data-c]').forEach(cb => cb.onchange = () => { d.types[+cb.dataset.i][cb.dataset.c] = cb.checked; drawTypes(); });
    $('types').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (removeType(+b.dataset.rm)) drawTypes(); });
  }
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    const s = sugg[b.dataset.s];
    addIfNew({ ...blankType(), name: s.name, unit: s.unit || '', min: s.min ?? '', max: s.max ?? '', target: s.target || '', kind: s.kind || '', needStage: s.needStage, phyto: !!s.phyto, leaf: s.leaf || '', untreatedOnly: !!s.untreatedOnly });
    drawTypes();
  });

  function commit(startAfter) {
    d.date = parseDmy($('a-date').value); d.assessor = $('a-who').value.trim(); d.notes = $('a-notes').value.trim();
    d.cropBBCH = $('a-bbch').value.trim(); d.cropBBCHMin = $('a-bbch-min').value.trim(); d.cropBBCHMax = $('a-bbch-max').value.trim();
    if (!d.date) { showStep(1); alert('Please enter the date as DD/MM/YYYY.'); $('a-date').focus(); return; }
    if (!d.cropBBCH) { showStep(1); alert('Please enter the crop growth stage (BBCH) – the majority value.'); $('a-bbch').focus(); return; }
    const tr = v => String(v ?? '').trim();
    d.types = d.types.map(ty => ({ ...ty, name: tr(ty.name), unit: tr(ty.unit), min: tr(ty.min), max: tr(ty.max), stage: tr(ty.stage), stageMin: tr(ty.stageMin), stageMax: tr(ty.stageMax), sizeL: tr(ty.sizeL), sizeW: tr(ty.sizeW), subs: subsOf(ty) })).filter(ty => ty.name);
    if (startAfter && !d.types.length) { showStep(2); alert('Add at least one assessment first.'); return; }
    const noStage = d.types.filter(ty => needsStage(ty) && !ty.stage);
    if (noStage.length) {
      showStep(2); drawTypes();
      alert('Please enter the majority growth stage for: ' + [...new Set(noStage.map(ty => ty.target))].join(', '));
      const el = $('types').querySelector(`input[data-i="${d.types.indexOf(noStage[0])}"][data-f="stage"]`); if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); }
      return;
    }
    const names = d.types.map(ty => typeLabel(ty).toLowerCase());
    if (new Set(names).size !== names.length) { showStep(2); alert('Two assessments have the same name and unit. Please make them distinct.'); return; }
    if (t.type === 'Herbicide' && t.untreated && d.types.length && !d.types.some(ty => ty.kind === 'weed' && ty.untreatedOnly && /count/i.test(ty.name))
      && !confirm('Are you sure you do not require a Untreated Weed Count for this assessment date?')) { showStep(2); return; }
    // drop data for removed assessments
    const ids = new Set(d.types.map(ty => ty.id));
    Object.values(d.data).forEach(r => Object.keys(r).forEach(k => { const base = k.startsWith('_s_') ? k.slice(3) : k; if (k !== '_note' && !ids.has(base)) delete r[k]; }));
    db.settings.assessor = d.assessor;
    const i = t.assessments.findIndex(x => x.id === d.id);
    if (i >= 0) t.assessments[i] = d; else t.assessments.push(d);
    t.updated = Date.now(); save();
    if (startAfter) go(`#/trial/${t.id}/a/${d.id}/plot/${firstIncomplete(t, d)}`);
    else { toast('Saved'); go(`#/trial/${t.id}`); }
  }
  $('a-start').onclick = () => commit(true);
  $('a-save').onclick = () => commit(false);
  drawMenu(); drawBuilder(); drawTypes(); showStep(step);
}

/* ---------- DATA ENTRY (one plot per page) ---------- */
function viewEntry(t, a, idx, focusAt) {
  const order = walkOrder(t);
  idx = clamp(idx, 0, order.length - 1);
  const p = order[idx];
  const last = order.length - 1;
  const done = countDone(t, a);
  const show = !!db.settings.showTrt;
  const rec = a.data[p.plot] || {};
  const base = `#/trial/${t.id}/a/${a.id}`;
  const hintOf = ty => [ty.unit, (ty.min !== '' || ty.max !== '') ? `${ty.min !== '' ? ty.min : '…'} to ${ty.max !== '' ? ty.max : '…'}` : ''].filter(Boolean).join(' · ');

  const fieldHtml = (ty, i) => {
    if (ty.untreatedOnly) return ''; // untreated counts are entered at the end in Review, so the untreated plots aren't revealed
    if (ty.noPhyto) return `<div class="nophyto">${esc(typeTitle(ty))}: No phyto (0 on every plot)</div>`;
    const hint = hintOf(ty), n = subsOf(ty);
    if (n > 1) {
      const arr = rec['_s_' + ty.id] || [];
      return `<div class="field entry-field"><span style="display:block;font-weight:600;margin-bottom:.3rem">${esc(typeTitle(ty))} <span class="hint">(${esc(hint ? hint + ' · ' : '')}${n} subsamples)</span></span>
        <div class="subgrid">${range(n).map(k => `<input class="ev" data-t="${ty.id}" data-i="${i}" data-k="${k - 1}" value="${esc(arr[k - 1] ?? '')}" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="Subsample ${k}" placeholder="${k}">`).join('')}</div>
        <div class="small muted" style="margin-top:4px;text-align:center">Mean: <b id="mean-${i}">${esc(rec[ty.id] ?? '–')}</b></div></div>`;
    }
    return `<label class="field entry-field"><span>${esc(typeTitle(ty))} ${hint ? `<span class="hint">(${esc(hint)})</span>` : ''}</span>
      <input class="ev" data-t="${ty.id}" data-i="${i}" value="${esc(rec[ty.id] ?? '')}" inputmode="decimal" enterkeyhint="next" autocomplete="off"></label>`;
  };

  app.innerHTML = `
  <div class="shell" id="shell">
  <header class="top"><a class="back" href="#/trial/${t.id}">← ${esc(t.trialId)}</a><span class="spacer"></span>
    <span class="small muted">${esc(dmy(a.date))}</span><a class="btn small" href="${base}/review">Review</a></header>
  <main class="entry">
    <div class="bar"><div style="width:${done / order.length * 100}%"></div></div>
    <div class="small muted">${done} of ${order.length} plots complete · page ${idx + 1} of ${order.length}</div>

    <section class="card plot-card" style="margin-top:8px">
      <span class="plot-no">Plot ${p.plot}</span>
      <span class="plot-meta">Rep <b>${p.rep}</b>${show ? ` · <b>${esc(trtLabel(t, p.trt))}</b>` : ''}</span>
      <span id="badge" class="done-badge"></span>
    </section>

    <form id="ef" onsubmit="return false" autocomplete="off">
    ${kb.sentinel('prev')}
    <section class="card">
      ${a.types.map(fieldHtml).join('')}
      ${kb.sentinel('next')}
      <label class="field" style="margin-bottom:0"><span>Plot note <span class="hint muted" style="font-weight:400">(optional – tap to add)</span></span>
        <input id="note" tabindex="-1" value="${esc(rec._note || '')}" enterkeyhint="done" autocomplete="off"></label>
    </section>
    </form>

    <div class="actions" style="justify-content:space-between;align-items:center">
      <label class="small" style="display:flex;gap:.5rem;align-items:center">Go to
        <select id="jump" style="width:auto;min-height:36px">${order.map((q, j) =>
          `<option value="${j}" ${j === idx ? 'selected' : ''}>${q.plot} · Rep ${q.rep}${plotComplete(t, a, q.plot) ? ' ✓' : plotStarted(a, q.plot) ? ' …' : ''}</option>`).join('')}</select></label>
      <label class="chk small"><input type="checkbox" id="showTrt" ${show ? 'checked' : ''}> Show treatment</label>
    </div>

  </main>
  <div class="navbtns">
    <button id="prev" ${idx === 0 ? 'disabled' : ''}>← Back</button>
    <button id="next" class="primary">Next →</button>
  </div>
  </div>`;

  const inputs = [...app.querySelectorAll('input.ev')];
  const note = document.getElementById('note');
  function check() {
    inputs.forEach(inp => {
      const ty = a.types[inp.dataset.i]; const s = outOfRange(ty, inp.value.trim());
      inp.classList.toggle('bad', s === 'bad'); inp.classList.toggle('warn', s === 'warn');
    });
    document.getElementById('badge').innerHTML = plotComplete(t, a, p.plot) ? `<span class="pill">✓ complete</span>` : '';
  }
  const rowFor = () => a.data[p.plot] || (a.data[p.plot] = {});
  const tidy = () => { if (a.data[p.plot] && !Object.keys(a.data[p.plot]).length) delete a.data[p.plot]; t.updated = Date.now(); save(); check(); };
  function store(key, v) {
    v = v.trim(); const r = rowFor();
    if (v === '') delete r[key]; else r[key] = v;
    tidy();
  }
  function storeSub(inp) {
    const ty = a.types[inp.dataset.i];
    const m = setSubValue(a, p.plot, ty, +inp.dataset.k, inp.value);
    const el = document.getElementById('mean-' + inp.dataset.i); if (el) el.textContent = m ?? '–';
    tidy();
  }
  const fields = inputs; // the notes box is outside the Next / arrow sequence
  const kbOpen = () => fields.includes(document.activeElement) || document.activeElement === note;
  // Draw the next plot in place (no hash change event) and refocus, so the keyboard stays open.
  function goPlot(to, at) {
    history.replaceState(null, '', `${base}/plot/${to}`);
    window.scrollTo(0, 0);
    viewEntry(t, a, to, at);
  }
  function warnRange() { if (inputs.some(inp => outOfRange(a.types[inp.dataset.i], inp.value.trim()) === 'bad')) toast('A value is outside its expected range'); }
  function nextPlot(at) {
    warnRange();
    if (idx === last) go(`${base}/review`); else goPlot(idx + 1, at);
  }
  function prevPlot(at) { if (idx > 0) goPlot(idx - 1, at); }
  function step(dir) {
    if (document.activeElement === note) { if (dir === 'down' || dir === 'right') nextPlot(0); else if (fields.length) fields[fields.length - 1].focus(); return; }
    if (!fields.length) { if (dir === 'down' || dir === 'right') nextPlot(undefined); else prevPlot(undefined); return; }
    const f = Math.max(fields.indexOf(document.activeElement), 0);
    if (dir === 'down') { if (f < fields.length - 1) fields[f + 1].focus(); else nextPlot(0); }
    else if (dir === 'up') { if (f > 0) fields[f - 1].focus(); else prevPlot(fields.length - 1); }
    else if (dir === 'right') nextPlot(f);
    else if (dir === 'left') prevPlot(f);
  }
  inputs.forEach(inp => {
    inp.oninput = () => inp.dataset.k !== undefined ? storeSub(inp) : store(inp.dataset.t, inp.value);
    inp.onfocus = () => setTimeout(() => inp.select(), 0);
    inp.onkeydown = e => { if (kb.key(e)) return; if (e.key === 'Enter') { e.preventDefault(); step('down'); } };
  });
  note.oninput = () => store('_note', note.value);
  note.onkeydown = e => { if (kb.key(e)) return; if (e.key === 'Enter') { e.preventDefault(); note.blur(); } };
  kb.use({ dirs: ['left', 'right', 'up', 'down'], go: step }, [...fields, note]);
  // The phone's own Previous / Next arrows run through hidden boxes before and after, so they carry on across plots
  app.querySelector('[data-sent="prev"]').onfocus = () => { if (idx > 0) prevPlot(fields.length - 1); else if (fields.length) fields[0].focus(); };
  app.querySelector('[data-sent="next"]').onfocus = () => { if (idx < last) nextPlot(0); else if (fields.length) fields[fields.length - 1].focus(); };
  // Next goes through the assessments on this plot first, then on to the next plot. Back does the reverse.
  const nextBtn = document.getElementById('next');
  const nextText = () => { const f = fields.indexOf(document.activeElement); return (f === fields.length - 1 || document.activeElement === note) ? (idx === last ? 'Finish → Review' : 'Next plot →') : 'Next →'; };
  const setNext = () => { nextBtn.textContent = nextText(); };
  fields.forEach(f => f.addEventListener('focus', setNext)); note.addEventListener('focus', setNext);
  ['prev', 'next'].forEach(id => document.getElementById(id).addEventListener('mousedown', e => e.preventDefault()));
  nextBtn.onclick = () => { if (fields.includes(document.activeElement) || document.activeElement === note) step('down'); else if (fields.length) fields[0].focus(); else nextPlot(undefined); };
  document.getElementById('prev').onclick = () => { if (fields.includes(document.activeElement)) step('up'); else if (document.activeElement === note) step('up'); else prevPlot(undefined); };
  document.getElementById('jump').onchange = e => goReplace(`${base}/plot/${e.target.value}`);
  document.getElementById('showTrt').onchange = e => { db.settings.showTrt = e.target.checked; save(); viewEntry(t, a, idx); };
  kb.shell(document.getElementById('shell'));
  check();
  if (focusAt != null && fields.length) fields[Math.min(focusAt, fields.length - 1)].focus();
  else { const firstEmpty = inputs.find(inp => inp.value === '') || null; if (firstEmpty && matchMedia('(pointer:fine)').matches) firstEmpty.focus(); }
}

/* ---------- box plot (SVG) ---------- */
function quantile(sorted, q) { const pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos); return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo); }
function boxPlotSvg(t, a, ty) {
  const st = typeStats(t, a, ty);
  const cols = range(t.trts).map(k => ({ k, v: st.groups[k].nums.slice().sort((x, y) => x - y) }));
  const all = cols.flatMap(c => c.v);
  const title = `<h3 style="margin:16px 0 4px">${esc(typeLabel(ty))}</h3>`;
  if (!all.length) return `<div class="bp">${title}<p class="small muted">No values yet.</p></div>`;
  let lo = Math.min(...all), hi = Math.max(...all);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const colW = 46, L = 44, T = 10, B = 34, H = 210;
  const W = L + cols.length * colW + 8, plotH = H - T - B;
  const y = v => T + plotH - (v - lo) / (hi - lo) * plotH;
  const nice = v => String(round(v, Math.abs(hi - lo) < 5 ? 2 : Math.abs(hi - lo) < 50 ? 1 : 0));
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; g += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${nice(v)}</text>`; }
  cols.forEach((c, i) => {
    const cx = L + colW * i + colW / 2, bw = 24;
    const lbl = `T${c.k}${c.k === t.untreated ? '·UTC' : ''}`;
    g += `<text x="${cx}" y="${H - 14}" text-anchor="middle">${lbl}</text>`;
    if (!c.v.length) return;
    const q1 = quantile(c.v, .25), med = quantile(c.v, .5), q3 = quantile(c.v, .75), mn = c.v[0], mx = c.v[c.v.length - 1];
    g += `<line x1="${cx}" x2="${cx}" y1="${y(mn)}" y2="${y(mx)}" stroke="var(--accent)" stroke-width="1.5"/>
      <line x1="${cx - 7}" x2="${cx + 7}" y1="${y(mn)}" y2="${y(mn)}" stroke="var(--accent)" stroke-width="1.5"/><line x1="${cx - 7}" x2="${cx + 7}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--accent)" stroke-width="1.5"/>
      <rect x="${cx - bw / 2}" y="${y(q3)}" width="${bw}" height="${Math.max(1, y(q1) - y(q3))}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" rx="2"/>
      <line x1="${cx - bw / 2}" x2="${cx + bw / 2}" y1="${y(med)}" y2="${y(med)}" stroke="var(--accent)" stroke-width="3"/>
      ${c.v.map(v => `<circle cx="${cx}" cy="${y(v)}" r="2.5" fill="var(--ink)" opacity=".7"/>`).join('')}`;
  });
  return `<div class="bp">${title}<div class="scroll" style="border:0"><svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W, 300)}px;max-width:${W * 1.6}px" role="img" aria-label="Box plot of ${esc(typeLabel(ty))} by treatment">${g}</svg></div></div>`;
}

/* ---------- REVIEW (raw data only) ---------- */
function viewReview(t, a) {
  const n = t.reps * t.trts;
  const done = countDone(t, a);
  const order = walkOrder(t);
  const idxOf = plot => order.findIndex(q => q.plot === plot);
  const base = `#/trial/${t.id}/a/${a.id}`;
  const allPlots = plots(t);

  app.innerHTML = `

/* ---------- EXCEL EXPORT (real .xlsx, no internet needed) ---------- */

  const cell = raw => { const n = num(raw); return n != null ? n : (raw === '' ? null : raw); };

  })));

    [B('Plots'), t.reps * t.trts], [B('Plot numbering'), t.numbering === 'seq' ? 'Sequential' : 'By rep (101, 201…)'],
    [B('Exported'), new Date().toLocaleString('en-GB')], [], [B('Trt'), B('Treatment name')], ...range(t.trts).map(k => [k, trtName(t, k) || null]),
    [], [B('Date'), B('Assessor'), B('Crop BBCH (majority)'), B('BBCH min'), B('BBCH max'), B('Assessment types'), B('Plots complete'), B('Notes')],
    ...as.map(a => [dmy(a.date), a.assessor || null, a.cropBBCH || null, a.cropBBCHMin || null, a.cropBBCHMax || null, a.types.map(typeLabel).join('; '), `${countDone(t, a)} / ${t.reps * t.trts}`, a.notes || null])];

/* ---------- PDF REPORT (built here, no internet needed) ---------- */
const CP1252 = { '–': 0x96, '—': 0x97, '‘': 0x91, '’': 0x92, '“': 0x93, '”': 0x94, '…': 0x85, '•': 0x95 };

function pdfFile(t, list) {
  const W = 842, H = 595, M = 36, pages = [];

  const f1 = n => (Math.round(n * 10) / 10).toString();

  const fit = (str, w, size, bold) => { str = String(str ?? ''); const max = Math.max(1, Math.floor(w / (size * (bold ? 0.56 : 0.52)))); return str.length > max ? str.slice(0, Math.max(1, max - 2)) + '..' : str; };

  const text = (x, yy, str, size = 10, bold = false) => cur.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${f1(x)} ${f1(yy)} Td (${pdfStr(str)}) Tj ET`);
  const rect = (x, yy, w, h, g) => cur.push(`${g} g ${f1(x)} ${f1(yy)} ${f1(w)} ${f1(h)} re f 0 g`);
  const hline = (x1, x2, yy) => cur.push(`0.75 G 0.5 w ${f1(x1)} ${f1(yy)} m ${f1(x2)} ${f1(yy)} l S 0 G`);
  const ensure = h => { if (y - h < M + 14) newPage(); };
  const line = (str, size = 10, bold = false, gap = 4) => { ensure(size + gap); y -= size; text(M, y, fit(str, W - 2 * M, size, bold), size, bold); y -= gap; };
  function table(heads, rows, widths, size = 9) {
    const rh = size + 7;
    const wrap = (str, w, bold) => { // simple word wrap, at most 6 lines
      const cap = Math.max(3, Math.floor((w - 4) / (size * (bold ? 0.56 : 0.52)))), lines = []; let curL = '';
      String(str ?? '').split(/\s+/).filter(Boolean).forEach(wd => {
        while (wd.length > cap) { if (curL) { lines.push(curL); curL = ''; } lines.push(wd.slice(0, cap)); wd = wd.slice(cap); }
        if ((curL + ' ' + wd).trim().length <= cap) curL = (curL + ' ' + wd).trim(); else { if (curL) lines.push(curL); curL = wd; }
      });
      if (curL) lines.push(curL); return lines.slice(0, 6);
    };
    const head = () => {
      const wr = heads.map((h, i) => wrap(h, widths[i], true)), hh = Math.max(1, ...wr.map(l => l.length)) * (size + 1) + 6;
      ensure(hh + rh); rect(M, y - hh, widths.reduce((a, b) => a + b, 0), hh, 0.9);
      let x = M; wr.forEach((lines, i) => { lines.forEach((ln, j) => text(i ? x + widths[i] / 2 - est(ln, size, true) / 2 : x + 4, y - (j + 1) * (size + 1) - 1, ln, size, true)); x += widths[i]; });
      y -= hh;
    };
    head();
    rows.forEach(r => {
      if (y - rh < M + 14) { newPage(); head(); }
      let x = M; r.forEach((c, i) => { const str = fit(c ?? '', widths[i] - 4, size, false); text(i ? x + widths[i] / 2 - est(str, size) / 2 : x + 4, y - rh + 5, str, size); x += widths[i]; });

    });
    y -= 8;
  }
  const rng = (a, b, c) => [a, b || c ? `(${b || '–'} to ${c || '–'})` : ''].filter(Boolean).join(' ');
  const sorted = [...list].sort((x, y2) => (x.date || '').localeCompare(y2.date || '') || x.created - y2.created);
  sorted.forEach(a => {
    newPage();
    line(`${t.trialId} – Assessment ${dmy(a.date)}`, 16, true, 6);
    if (t.desc) line(t.desc, 10, false, 2);
    line([t.type, t.crop, `${t.reps} reps × ${t.trts} treatments`].filter(Boolean).join('  ·  '), 10, false, 2);
    line(`Assessor: ${a.assessor || '–'}    Crop growth stage (BBCH): ${rng(a.cropBBCH || '–', a.cropBBCHMin, a.cropBBCHMax)}${a.notes ? '    Notes: ' + a.notes : ''}`, 10, false, 8);
    line('Assessments on this date', 11, true, 3);
    a.types.forEach((ty, i) => {
      const bits = [`${i + 1}. ${typeLabel(ty)}`];
      if (subsOf(ty) > 1) bits.push(`${subsOf(ty)} subsamples`);
      if (ty.noPhyto) bits.push('No phyto (0 on all plots)');
      if (needsStage(ty)) bits.push(`${ty.kind === 'weed' ? 'Weed' : 'Pest'} growth stage ${rng(ty.stage || '–', ty.stageMin, ty.stageMax)}`);
      if (ty.kind === 'weed' && (ty.sizeL || ty.sizeW)) bits.push(`size ${ty.sizeL || '–'} × ${ty.sizeW || '–'}`);
      line(bits.join('   ·   '), 9, false, 2);
    });
    y -= 6;
    a.types.forEach(ty => {
      const ks = range(t.trts).filter(k => applies(t, ty, k));
      ensure(60); line(typeLabel(ty) + (ty.untreatedOnly ? '  (untreated plots only)' : ''), 11, true, 3);
      const repW = Math.max(30, Math.min(80, (W - 2 * M - 170) / t.reps));
      const widths = [170, ...range(t.reps).map(() => repW)];
      const nsub = ty.noPhyto ? 1 : subsOf(ty);
      const cellOf = pl => { if (!pl) return ''; if (nsub > 1) return (((a.data[pl.plot] || {})['_s_' + ty.id]) || []).filter(x => x !== '').join(' / '); return val(a, pl.plot, ty.id); };
      const rows = ks.map(k => [`${k} ${trtName(t, k)}${k === t.untreated ? ' (untreated)' : ''}`.trim(), ...range(t.reps).map(r => cellOf(plots(t).find(q => q.rep === r && q.trt === k)))]);
      table(['Treatment', ...range(t.reps).map(r => 'Rep ' + r)], rows, widths);
    });
    // plot data, one row per plot (split across several tables when there are many columns)
    newPage(); line(`Plot data – ${dmy(a.date)}`, 12, true, 4);
    const dc = expandCols([a]), perTable = Math.max(1, Math.floor((W - 2 * M - 200) / 66));
    const prow = plots(t).sort((x, y2) => x.plot - y2.plot);
    for (let i = 0; i < dc.length; i += perTable) {
      const chunk = dc.slice(i, i + perTable);
      if (i) { ensure(80); }
      table(['Plot', 'Rep', 'Trt', 'Treatment', ...chunk.map(c => c.label)],
        prow.map(p => [p.plot, p.rep, p.trt, trtName(t, p.trt) + (p.trt === t.untreated ? ' *' : ''), ...chunk.map(c => applies(t, c.ty, p.trt) ? colVal(c, p.plot) : '')]),
        [40, 30, 30, 100, ...chunk.map(() => 66)], 8);
    }
    const notes = Object.entries(a.data).filter(([, r]) => r._note).sort((x, y2) => x[0] - y2[0]);
    if (notes.length) { ensure(40); line('Plot notes', 11, true, 3); notes.forEach(([pl, r]) => line(`Plot ${pl}: ${r._note}`, 9, false, 2)); }
  });
  // field layout, rep 1 at the bottom
  newPage(); line('Field layout (rep 1 at the bottom)', 12, true, 4);
  const lw = [50, ...range(t.trts).map(() => Math.max(34, Math.min(60, (W - 2 * M - 50) / t.trts)))];
  const lrows = []; for (let r = t.reps - 1; r >= 0; r--) lrows.push([`Rep ${r + 1}`, ...t.layout[r].map((k, i) => `${plotNo(t, r, i)} T${k}${k === t.untreated ? '*' : ''}`)]);
  table(['', ...range(t.trts).map(i => String(i))], lrows, lw, 8);
  if (t.untreated) line('* untreated', 8, false, 2);
  pages.forEach((ops, i) => { cur = ops; text(M, 20, `${t.trialId} – Field Assessments`, 8); const lbl = `Page ${i + 1} of ${pages.length}`; text(W - M - est(lbl, 8), 20, lbl, 8); });
  let out = '%PDF-1.4\n'; const offs = [];
  const add = (n, body) => { offs[n] = out.length; out += `${n} 0 obj\n${body}\nendobj\n`; };
  add(1, '<< /Type /Catalog /Pages 2 0 R >>');
  add(2, `<< /Type /Pages /Kids [${pages.map((_, i) => `${5 + i * 2} 0 R`).join(' ')}] /Count ${pages.length} >>`);
  add(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add(4, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  pages.forEach((ops, i) => {
    const content = ops.join('\n'), pn = 5 + i * 2;
    add(pn, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${pn + 1} 0 R >>`);
    add(pn + 1, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  });
